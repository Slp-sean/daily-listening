<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>巧记单词 · 最新听读</title><style>body{font-family:-apple-system,sans-serif;background:#f5f7f6;color:#234d4f;max-width:480px;margin:18vh auto;padding:24px;line-height:1.8}a{color:inherit}button{padding:10px 20px;border-radius:8px;background:white;border:1px solid #ccc}</style></head><body><h2>巧记单词 · 每日听读</h2><p id="status">正在打开最新一期…</p><button id="retry" hidden>重新读取</button><script>
const base=new URL(location.pathname.endsWith('/latest/')?'../':'./',location.href);
async function openLatest(){try{const res=await fetch(new URL('manifest.json?v='+Date.now(),base),{cache:'no-store',headers:{'Cache-Control':'no-cache'}});if(!res.ok)throw Error('最新一期正在准备，请稍后重试。');const m=await res.json();if(!/^\d{4}-\d{2}-\d{2}\/(?:[a-f0-9]{64}\/)?$/.test(m.path))throw Error('最新一期索引异常。');if(m.preview||m.schema_version!==2){document.getElementById('status').textContent='当前仅为首发预览，正式次日内容尚未准备完成。';return}const target=new URL(m.path,base);const check=await fetch(new URL('content.json?v='+Date.now(),target),{cache:'no-store'});if(!check.ok)throw Error('最新一期正在准备，请稍后重试。');const bytes=await check.arrayBuffer();const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))).map(v=>v.toString(16).padStart(2,'0')).join('');const content=JSON.parse(new TextDecoder().decode(bytes));if(hash!==m.artifact_hash||content.content_hash!==m.content_hash||content.session_id!==m.session_id||content.queue_snapshot_hash!==m.queue_snapshot_hash||content.preview||content.date!==m.date||JSON.stringify(content.groups.map(g=>({group_id:g.group_id,group_signature:g.group_signature,active_version:g.active_version,content_hash:g.content_hash})))!==JSON.stringify(m.groups))throw Error('内容同步中，请稍后重试。');target.searchParams.set('v',m.content_hash.slice(0,12));location.replace(target.href)}catch(e){document.getElementById('status').textContent=e.message;document.getElementById('retry').hidden=false}}
document.getElementById('retry').onclick=openLatest;openLatest();
</script></body></html>
