<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#163f42"><title>巧记单词 · 每日听读</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#18383c;background:#f5f7f6;font-synthesis:none}*{box-sizing:border-box}body{margin:0}header{padding:calc(24px + env(safe-area-inset-top)) 22px 22px;background:#163f42;color:#fff}header small{letter-spacing:2px;color:#bccecd}h1{font-size:27px;margin:10px 0}#subtitle{font-size:13px;color:#cbdad9}main{max-width:680px;margin:auto;padding:20px 16px 36px}nav{display:flex;gap:8px;margin-bottom:20px}button,a.button{font:inherit;border:1px solid #cfdbd8;border-radius:11px;background:#fff;color:#234d4f;padding:11px 15px;cursor:pointer;text-decoration:none}button:disabled{opacity:.4}nav button{flex:1}button.active{background:#163f42;color:#fff;border-color:#163f42}.hint{font-size:13px;color:#758786;line-height:1.7;margin:12px 0 20px}.packTag{font-size:12px;color:#537774;background:#e9f0ed;border-radius:5px;padding:4px 7px;white-space:nowrap}.word{display:grid;grid-template-columns:1fr auto;gap:8px;padding:17px 2px;border-bottom:1px solid #dfe7e3}.word b{font-size:21px;line-height:1.3}.word p{grid-column:1/-1;margin:0;font-size:14px;color:#5f7370;line-height:1.6}article{background:white;border-radius:16px;padding:20px;box-shadow:0 3px 14px #1b403b08}article h2{font-size:20px;margin:0 0 9px}article h3{font-size:16px;margin:25px 0 10px;color:#376664}article p{font-size:18px;line-height:2.1;margin:0;color:#314944;overflow-wrap:anywhere}.target{color:#096d72;font-weight:600}.gloss{font-weight:400;font-size:15px;color:#738784}body.hide-gloss .gloss{display:none}.controls{background:white;border:1px solid #e1e9e4;border-radius:16px;padding:16px;margin-top:14px;position:sticky;bottom:calc(8px + env(safe-area-inset-bottom));box-shadow:0 4px 20px #19342f12}audio{display:block;width:100%;margin-bottom:12px}.row{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0;flex-wrap:wrap}.row button{padding:9px 12px;font-size:14px}#play{min-width:95px;background:#163f42;color:white}label{font-size:13px;color:#52716d;display:flex;align-items:center;gap:8px}.pack-nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:16px 0}.pack-nav span{font-size:13px}#error{color:#935147;white-space:pre-wrap}.foot{font-size:12px;color:#718781;text-align:center;margin-top:28px}.foot a{color:inherit}#playerMessage{font-size:12px;color:#805840;text-align:center}button:focus-visible,a:focus-visible{outline:3px solid #75b3a6;outline-offset:2px}
.date-picker{background:white;border:1px solid #dfe7e3;border-radius:14px;padding:14px;margin-bottom:18px}.date-picker label{display:block;font-weight:600;margin-bottom:9px}.date-picker select{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid #cfdbd8;border-radius:9px;background:#fff;color:#234d4f}.date-actions{display:flex;gap:8px;margin-top:10px}.date-actions button{flex:1;font-size:13px;padding:10px 7px}.date-meta{font-size:12px;color:#718781;margin:10px 0 0}.date-picker details{font-size:12px;color:#718781;margin-top:10px}.date-picker details a{display:block;padding:8px 0;color:#537774}header small{letter-spacing:1px}#notice{margin-bottom:14px}</style></head><body><header><small>巧记单词 · DAILY LISTENING</small><h1 id="date">每日移动听读</h1><div id="subtitle">正在读取…</div></header><main><section class="date-picker" aria-label="选择学习日期"><label for="studyDate">选择学习日期</label><select id="studyDate" disabled><option>正在读取已发布日期…</option></select><div class="date-actions"><button id="older" disabled>上一期</button><button id="newer" disabled>下一期</button><button id="latestDate" disabled>回到最新</button></div><p id="dateMeta" class="date-meta" aria-live="polite"></p><details id="previewArchive" hidden><summary>非正式历史预览</summary><div id="previewLinks"></div></details></section><nav aria-label="学习模式"><button id="fullTab" class="active" aria-selected="true">全篇展示</button><button id="listenTab" aria-selected="false">情景听读</button></nav><p id="notice" class="hint">次日预习 · 按正式学习顺序浏览；评级请在电脑端完成。</p><div id="error" role="status"></div><section id="overview" aria-label="全部目标词"></section><section id="listening" hidden><div class="pack-nav"><button id="previous">上一 Group</button><span id="packNumber"></span><button id="next">下一 Group</button></div><article><h2 id="packTitle"></h2><div id="scenes"></div></article><div class="controls"><audio id="audio" controls preload="metadata" playsinline></audio><div class="row"><button id="back">−15 秒</button><button id="play">播放</button><button id="forward">+15 秒</button></div><div class="row" aria-label="播放速度"><button data-rate="0.8">0.8×</button><button data-rate="1">1×</button><button data-rate="1.2">1.2×</button><label><input type="checkbox" id="gloss" checked>显示中文释义</label></div><div id="playerMessage" role="status"></div></div></section><p class="foot">手机端仅浏览与听读 · 正式评级请在电脑端完成</p></main>
<script>
'use strict';
const $=id=>document.getElementById(id),audio=$('audio');
const base=new URL(location.pathname.endsWith('/latest/')?'../':'./',location.href);
let data,units=[],index=0,positions={},pref={},entries=[],currentPath,loadId=0,loading=false,restorePosition=0,saveAt=0,refreshAt=0;
try{pref=JSON.parse(localStorage.getItem('daily-listening')||'{}')}catch(e){}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key=d=>d.date+':'+d.content_hash;
function display(s){let result='',offset=0;for(const match of s.content_markup.matchAll(/\{\{([^{}|]+)\|([^{}|]+)\}\}/g)){const token=match[1].trim()+'（'+match[2].trim()+'）';const at=s.display_content.indexOf(token,offset);if(at<0)throw Error('正式正文与释义不一致。');result+=esc(s.display_content.slice(offset,at))+'<span class="target">'+esc(match[1].trim())+'<span class="gloss">（'+esc(match[2].trim())+'）</span></span>';offset=at+token.length}return result+esc(s.display_content.slice(offset))}
function save(){if(!data||loading||!units[index])return;positions[units[index].group_id]=audio.currentTime||0;const k=key(data);const savedPositions=pref.last_audio_position?.entries||{};savedPositions[k]={...positions};const savedGroups=pref.last_pack?.entries||{};savedGroups[k]=units[index].group_id;pref={last_pack:{date:data.date,content_hash:data.content_hash,group_id:units[index].group_id,entries:savedGroups},last_audio_position:{date:data.date,content_hash:data.content_hash,positions:{...positions},entries:savedPositions},playback_rate:audio.playbackRate||1,show_gloss:$('gloss').checked};try{localStorage.setItem('daily-listening',JSON.stringify(pref))}catch(e){}}
function rate(r){audio.playbackRate=r;document.querySelectorAll('[data-rate]').forEach(b=>b.classList.toggle('active',Number(b.dataset.rate)===r));save()}
function mode(listen){$('overview').hidden=listen;$('listening').hidden=!listen;for(const [id,active] of [['fullTab',!listen],['listenTab',listen]]){$(id).classList.toggle('active',active);$(id).setAttribute('aria-selected',String(active))}}
function pack(i){if(!data)return;if(audio.src)save();audio.pause();index=Math.max(0,Math.min(i,units.length-1));const p=units[index];$('previous').disabled=index===0;$('next').disabled=index===units.length-1;$('packNumber').textContent=`${index+1} / ${units.length}`;$('packTitle').textContent=`${p.group_id} · 本期 ${p.words.length} 词`;$('scenes').innerHTML=p.segments.map(s=>'<h3>'+esc(s.title)+'</h3><p>'+display(s)+'</p>').join('');restorePosition=positions[p.group_id]||0;loading=true;audio.src=new URL(p.audio,new URL(currentPath,base)).href;audio.load();$('playerMessage').textContent='';if('mediaSession' in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:p.group_id+' · '+data.date,artist:'巧记单词',album:'每日移动听读'});}
audio.addEventListener('loadedmetadata',()=>{const pos=restorePosition;loading=false;if(Number.isFinite(audio.duration)&&pos<audio.duration-1)audio.currentTime=pos;rate([.8,1,1.2].includes(Number(pref.playback_rate))?Number(pref.playback_rate):1)});
audio.addEventListener('timeupdate',()=>{if(Date.now()-saveAt>1000){saveAt=Date.now();save()}});audio.addEventListener('seeked',save);audio.addEventListener('pause',()=>{$('play').textContent='播放';save()});audio.addEventListener('play',()=>{$('play').textContent='暂停'});audio.addEventListener('error',()=>{loading=false;$('playerMessage').textContent='音频暂未加载，请检查网络后重试。'});
function seek(delta){if(Number.isFinite(audio.duration)){audio.currentTime=Math.max(0,Math.min(audio.duration,audio.currentTime+delta));save()}}
async function play(){try{await audio.play();$('playerMessage').textContent=''}catch(e){$('playerMessage').textContent='请点击音频控件开始播放。'}}
$('play').onclick=()=>audio.paused?play():audio.pause();$('back').onclick=()=>seek(-15);$('forward').onclick=()=>seek(15);$('previous').onclick=()=>pack(index-1);$('next').onclick=()=>pack(index+1);$('fullTab').onclick=()=>mode(false);$('listenTab').onclick=()=>mode(true);
document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{pref.playback_rate=Number(b.dataset.rate);rate(pref.playback_rate)});$('gloss').onchange=()=>{document.body.classList.toggle('hide-gloss',!$('gloss').checked);save()};window.addEventListener('pagehide',save);
if('mediaSession' in navigator){for(const [action,handler] of [['play',play],['pause',()=>audio.pause()],['seekbackward',()=>seek(-15)],['seekforward',()=>seek(15)],['previoustrack',()=>pack(index-1)],['nexttrack',()=>pack(index+1)]]){try{navigator.mediaSession.setActionHandler(action,handler)}catch(e){}}try{navigator.mediaSession.setActionHandler('seekto',e=>{audio.currentTime=e.seekTime;save()})}catch(e){}}
function validEntry(m){return m?.schema_version===2&&!m.preview&&/^\d{4}-\d{2}-\d{2}$/.test(m.date)&&m.path===m.date+'/'+m.content_hash+'/'&&/^[a-f0-9]{64}$/.test(m.content_hash)&&/^[a-f0-9]{64}$/.test(m.artifact_hash)}
async function json(path){const url=new URL(path,base);url.searchParams.set('v',Date.now());const r=await fetch(url,{cache:'no-store'});if(!r.ok){const error=Error('内容暂未加载，请检查网络后重试。');error.status=r.status;throw error}return r.json()}
function dates(){const selected=data?.date||entries[0]?.date;$('studyDate').innerHTML=entries.map((e,i)=>'<option value="'+esc(e.date)+'">'+esc(e.date)+(i===0?' · 最新':'')+(e.word_count?' · '+e.word_count+'词':'')+'</option>').join('');$('studyDate').value=selected;const i=entries.findIndex(e=>e.date===selected);$('studyDate').disabled=!entries.length;$('older').disabled=i<0||i>=entries.length-1;$('newer').disabled=i<=0;$('latestDate').disabled=!entries.length||(i===0&&data?.content_hash===entries[0].content_hash);$('dateMeta').textContent=`已发布 ${entries.length} 期 · 按学习日期排列`;}
function address(day,push){const url=new URL(location.href);if(day===entries[0]?.date)url.searchParams.delete('date');else url.searchParams.set('date',day);url.searchParams.delete('v');if(push)history.pushState({},'',url);else history.replaceState({},'',url)}
async function choose(day,push=true){const entry=entries.find(e=>e.date===day);if(!entry)return;const id=++loadId;save();audio.pause();$('error').textContent='';$('dateMeta').textContent='正在读取 '+day+'…';try{const url=new URL(entry.path+'content.json',base);url.searchParams.set('v',entry.artifact_hash);const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('这期内容暂未加载，请稍后重试。');const bytes=await r.arrayBuffer();const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))).map(v=>v.toString(16).padStart(2,'0')).join('');const next=JSON.parse(new TextDecoder().decode(bytes));if(hash!==entry.artifact_hash||next.content_hash!==entry.content_hash||next.session_id!==entry.session_id||next.queue_snapshot_hash!==entry.queue_snapshot_hash||next.date!==entry.date||next.preview||JSON.stringify(next.groups.map(g=>({group_id:g.group_id,group_signature:g.group_signature,active_version:g.active_version,content_hash:g.content_hash})))!==JSON.stringify(entry.groups))throw Error('这期内容正在同步，请稍后重试。');if(id!==loadId)return;loading=true;data=next;units=data.groups;currentPath=entry.path;const k=key(data);positions={...(pref.last_audio_position?.entries?.[k]||(pref.last_audio_position?.date===data.date&&pref.last_audio_position?.content_hash===data.content_hash?pref.last_audio_position.positions:{}))};const lastGroup=pref.last_pack?.entries?.[k]||(pref.last_pack?.date===data.date&&pref.last_pack?.content_hash===data.content_hash?pref.last_pack.group_id:null);const last=units.findIndex(g=>g.group_id===lastGroup);$('date').textContent=data.date;$('subtitle').textContent=`${units.length} 个 Group · ${data.words.length} 词`;$('notice').textContent=(day===entries[0].date?'最新已发布内容':'历史内容回顾')+' · 与电脑端同一正式版本；评级请在电脑端完成。';$('overview').innerHTML=data.words.map(w=>'<div class="word"><b>'+esc(w.word)+'</b><span class="packTag">'+esc(w.group_id)+'</span><p>'+esc(w.translation)+'</p></div>').join('');$('gloss').checked=pref.show_gloss!==false;document.body.classList.toggle('hide-gloss',!$('gloss').checked);pack(last<0?0:last);dates();address(day,push)}catch(e){if(id===loadId){$('error').textContent=e.message;dates()}}}
async function refresh(initial=false){try{const latest=await json('manifest.json');let archive;try{archive=await json('history.json')}catch(e){if(e.status!==404)throw e;archive={entries:[],previews:[]}}const byDate=new Map((archive.entries||[]).filter(validEntry).map(e=>[e.date,e]));if(validEntry(latest))byDate.set(latest.date,latest);entries=Array.from(byDate.values()).sort((a,b)=>b.date.localeCompare(a.date));const previews=(archive.previews||[]).filter(p=>p.preview&&/^\d{4}-\d{2}-\d{2}\/$/.test(p.path));$('previewArchive').hidden=!previews.length;$('previewLinks').innerHTML=previews.map(p=>'<a href="'+esc(new URL(p.path,base).href)+'">'+esc(p.date)+' · 首发预览 · '+p.word_count+'词（非正式每日内容）</a>').join('');refreshAt=Date.now();if(!entries.length){$('notice').textContent='当前仅为首发预览，正式次日内容尚未准备完成。';$('dateMeta').textContent='尚无已发布的正式日期';return}dates();if(initial){const requested=new URL(location.href).searchParams.get('date');await choose(entries.some(e=>e.date===requested)?requested:entries[0].date,false)}else if(!new URL(location.href).searchParams.has('date')&&audio.paused&&data?.content_hash!==entries[0].content_hash){await choose(entries[0].date,false)}}catch(e){$('error').textContent=e.message;$('dateMeta').textContent='请重新打开或刷新页面重试。'}}
$('studyDate').onchange=()=>choose($('studyDate').value);$('older').onclick=()=>{const i=entries.findIndex(e=>e.date===data?.date);if(entries[i+1])choose(entries[i+1].date)};$('newer').onclick=()=>{const i=entries.findIndex(e=>e.date===data?.date);if(i>0)choose(entries[i-1].date)};$('latestDate').onclick=()=>choose(entries[0]?.date);window.addEventListener('popstate',()=>choose(new URL(location.href).searchParams.get('date')||entries[0]?.date,false));document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else if(Date.now()-refreshAt>60000)refresh()});window.addEventListener('pageshow',e=>{if(e.persisted)refresh()});refresh(true);
</script></body></html>
