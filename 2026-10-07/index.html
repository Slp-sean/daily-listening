<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#163f42"><title>巧记单词 · 每日听读</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#18383c;background:#f5f7f6;font-synthesis:none}*{box-sizing:border-box}body{margin:0}header{padding:calc(24px + env(safe-area-inset-top)) 22px 22px;background:#163f42;color:#fff}header small{letter-spacing:2px;color:#bccecd}h1{font-size:27px;margin:10px 0}#subtitle{font-size:13px;color:#cbdad9}main{max-width:680px;margin:auto;padding:20px 16px 36px}nav{display:flex;gap:8px;margin-bottom:20px}button,a.button{font:inherit;border:1px solid #cfdbd8;border-radius:11px;background:#fff;color:#234d4f;padding:11px 15px;cursor:pointer;text-decoration:none}button:disabled{opacity:.4}nav button{flex:1}button.active{background:#163f42;color:#fff;border-color:#163f42}.hint{font-size:13px;color:#758786;line-height:1.7;margin:12px 0 20px}.packTag{font-size:12px;color:#537774;background:#e9f0ed;border-radius:5px;padding:4px 7px;white-space:nowrap}.word{display:grid;grid-template-columns:1fr auto;gap:8px;padding:17px 2px;border-bottom:1px solid #dfe7e3}.word b{font-size:21px;line-height:1.3}.word p{grid-column:1/-1;margin:0;font-size:14px;color:#5f7370;line-height:1.6}article{background:white;border-radius:16px;padding:20px;box-shadow:0 3px 14px #1b403b08}article h2{font-size:20px;margin:0 0 9px}article h3{font-size:16px;margin:25px 0 10px;color:#376664}article p{font-size:18px;line-height:2.1;margin:0;color:#314944;overflow-wrap:anywhere}.target{color:#096d72;font-weight:600}.gloss{font-weight:400;font-size:15px;color:#738784}body.hide-gloss .gloss{display:none}.controls{background:white;border:1px solid #e1e9e4;border-radius:16px;padding:16px;margin-top:14px;position:sticky;bottom:calc(8px + env(safe-area-inset-bottom));box-shadow:0 4px 20px #19342f12}audio{display:block;width:100%;margin-bottom:12px}.row{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0;flex-wrap:wrap}.row button{padding:9px 12px;font-size:14px}#play{min-width:95px;background:#163f42;color:white}label{font-size:13px;color:#52716d;display:flex;align-items:center;gap:8px}.pack-nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:16px 0}.pack-nav span{font-size:13px}#error{color:#935147;white-space:pre-wrap}.foot{font-size:12px;color:#718781;text-align:center;margin-top:28px}.foot a{color:inherit}#playerMessage{font-size:12px;color:#805840;text-align:center}button:focus-visible,a:focus-visible{outline:3px solid #75b3a6;outline-offset:2px}
</style></head><body><header><small>巧记单词 · DAILY LISTENING</small><h1 id="date">每日移动听读</h1><div id="subtitle">正在读取…</div></header><main><nav aria-label="学习模式"><button id="fullTab" class="active" aria-selected="true">全篇展示</button><button id="listenTab" aria-selected="false">情景听读</button></nav><p id="notice" class="hint">次日预习 · 按正式学习顺序浏览；评级请在电脑端完成。</p><div id="error" role="status"></div><section id="overview" aria-label="全部目标词"></section><section id="listening" hidden><div class="pack-nav"><button id="previous">上一 Pack</button><span id="packNumber"></span><button id="next">下一 Pack</button></div><article><h2 id="packTitle"></h2><div id="scenes"></div></article><div class="controls"><audio id="audio" controls preload="metadata" playsinline></audio><div class="row"><button id="back">−15 秒</button><button id="play">播放</button><button id="forward">+15 秒</button></div><div class="row" aria-label="播放速度"><button data-rate="0.8">0.8×</button><button data-rate="1">1×</button><button data-rate="1.2">1.2×</button><label><input type="checkbox" id="gloss" checked>显示中文释义</label></div><div id="playerMessage" role="status"></div></div></section><p class="foot"><a href="../latest/">打开最新一期</a> · 预习不改变学习进度</p></main>
<script>
'use strict';
const $=id=>document.getElementById(id),audio=$('audio');
let data,index=0,positions={},pref={},saveAt=0,loading=false,restorePosition=0;
try{pref=JSON.parse(localStorage.getItem('daily-listening')||'{}')}catch(e){}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){if(!data||loading)return;positions[data.packs[index].pack_id]=audio.currentTime||0;const safe={last_pack:{date:data.date,pack_id:data.packs[index].pack_id},last_audio_position:{date:data.date,positions},playback_rate:audio.playbackRate||1,show_gloss:$('gloss').checked};try{localStorage.setItem('daily-listening',JSON.stringify(safe))}catch(e){}}
function rate(r){audio.playbackRate=r;document.querySelectorAll('[data-rate]').forEach(b=>b.classList.toggle('active',Number(b.dataset.rate)===r));save()}
function mode(listen){$('overview').hidden=listen;$('listening').hidden=!listen;for(const [id,active] of [['fullTab',!listen],['listenTab',listen]]){$(id).classList.toggle('active',active);$(id).setAttribute('aria-selected',String(active))}}
function pack(i){if(!data)return;if(audio.src)save();audio.pause();index=Math.max(0,Math.min(i,data.packs.length-1));const p=data.packs[index];$('previous').disabled=index===0;$('next').disabled=index===data.packs.length-1;$('packNumber').textContent=`${index+1} / ${data.packs.length}`;$('packTitle').textContent=`${p.pack_id} · 本期 ${p.words.length} 词`;$('scenes').innerHTML=p.segments.map(s=>'<h3>'+esc(s.title)+'</h3><p>'+esc(s.content_markup).replace(/\{\{([^{}|]+)\|([^{}|]+)\}\}/g,'<span class="target">$1<span class="gloss">（$2）</span></span>')+'</p>').join('');restorePosition=positions[p.pack_id]||0;loading=true;audio.src=new URL(p.audio,location.href).href;audio.load();$('playerMessage').textContent='';if('mediaSession' in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:p.pack_id+' · '+data.date,artist:'巧记单词',album:'每日移动听读'});}save();}
audio.addEventListener('loadedmetadata',()=>{const p=data.packs[index];const pos=restorePosition;loading=false;if(Number.isFinite(audio.duration)&&pos<audio.duration-1)audio.currentTime=pos;rate([.8,1,1.2].includes(Number(pref.playback_rate))?Number(pref.playback_rate):1)});
audio.addEventListener('timeupdate',()=>{if(Date.now()-saveAt>1000){saveAt=Date.now();save()}});
audio.addEventListener('seeked',save);audio.addEventListener('pause',()=>{$('play').textContent='播放';save()});audio.addEventListener('play',()=>{$('play').textContent='暂停'});audio.addEventListener('error',()=>{$('playerMessage').textContent='音频暂未加载，请检查网络后重试。'});
function seek(delta){if(Number.isFinite(audio.duration)){audio.currentTime=Math.max(0,Math.min(audio.duration,audio.currentTime+delta));save()}}
async function play(){try{await audio.play();$('playerMessage').textContent=''}catch(e){$('playerMessage').textContent='请点击音频控件开始播放。'}}
$('play').onclick=()=>audio.paused?play():audio.pause();$('back').onclick=()=>seek(-15);$('forward').onclick=()=>seek(15);$('previous').onclick=()=>pack(index-1);$('next').onclick=()=>pack(index+1);$('fullTab').onclick=()=>mode(false);$('listenTab').onclick=()=>mode(true);
document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{pref.playback_rate=Number(b.dataset.rate);rate(pref.playback_rate)});$('gloss').onchange=()=>{document.body.classList.toggle('hide-gloss',!$('gloss').checked);save()};window.addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
if('mediaSession' in navigator){for(const [action,handler] of [['play',play],['pause',()=>audio.pause()],['seekbackward',()=>seek(-15)],['seekforward',()=>seek(15)],['previoustrack',()=>pack(index-1)],['nexttrack',()=>pack(index+1)]]){try{navigator.mediaSession.setActionHandler(action,handler)}catch(e){}}try{navigator.mediaSession.setActionHandler('seekto',e=>{audio.currentTime=e.seekTime;save()})}catch(e){}}
(async()=>{try{const r=await fetch('content.json',{cache:'no-cache'});if(!r.ok)throw Error('本期内容暂不可用，请稍后重试。');data=await r.json();if(data.schema_version!==1||!data.packs.length)throw Error('本期内容格式异常。');$('date').textContent=data.date;$('subtitle').textContent=`${data.packs.length} 个 Pack · ${data.words.length} 词`;$('notice').textContent=data.preview?'真实 Pack 首发预览 · 用于浏览与听读，不是已安排的明日学习任务。':'次日预习 · 按正式学习顺序浏览；评级请在电脑端完成。';$('overview').innerHTML=data.words.map(w=>'<div class="word"><b>'+esc(w.word)+'</b><span class="packTag">'+esc(w.pack_id)+'</span><p>'+esc(w.translation)+'</p></div>').join('');if(pref.last_audio_position?.date===data.date)positions=pref.last_audio_position.positions||{};const last=pref.last_pack?.date===data.date?data.packs.findIndex(p=>p.pack_id===pref.last_pack.pack_id):0;$('gloss').checked=pref.show_gloss!==false;document.body.classList.toggle('hide-gloss',!$('gloss').checked);pack(last<0?0:last)}catch(e){$('subtitle').textContent='请稍后重试';$('error').textContent=e.message}})();
</script></body></html>
